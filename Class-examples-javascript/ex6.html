<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JavaScript with HTML</title>
</head>
<body>
  <h1>Button Click Demo</h1>
  <p id="result">Click the button to change this text.</p>
  <button id="changeBtn">Click Me</button>

  <script>
    const result = document.getElementById("result");
    const changeBtn = document.getElementById("changeBtn");

    changeBtn.addEventListener("click", function () {
      result.textContent = "JavaScript responded to the button click.";
    });
  </script>
</body>
</html>
